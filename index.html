<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shardfall - Vividresque Studios</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #050505; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <!-- Replace the src link below with your actual Rosebud Embed URL -->
    <iframe id="game-frame" src="https://rosebud.ai/d/wildbound-156" allow="fullscreen; autoplay; clipboard-write" allowfullscreen="true" tabindex="0"></iframe>

    <script>
        // This forces the browser to focus on the game immediately so it doesn't ignore your clicks or keyboard inputs on the start screen.
        window.onload = function() {
            const gameFrame = document.getElementById('game-frame');
            if(gameFrame) {
                gameFrame.focus();
            }
        };
        
        // Re-focus if the user clicks the black background by accident
        document.body.addEventListener('click', function() {
            document.getElementById('game-frame').focus();
        });
    </script>
</body>
</html>
